<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        table {
            border-collapse: collapse;
            margin-bottom: 24px;
            width: 100%;
            padding: 6px 16px;
            text-align: center;

        }

        th, td {
            border: 1px solid #000;     /* 테두리: 두께 1px, 실선, 검정 */
            padding: 6px 16px;          /* 칸 안쪽 여백 (위아래 6px, 좌우 16px) */
        }
    </style>


</head>



<body>
<table>
    <tbody>
    <tr>
        <td>내용1</td>
        <td>내용2</td>
        <td>내용3</td>
        <td>내용4</td>
    </tr>
    <tr>
        <td>내용5</td>
        <td colspan="2">colspan="2" 영역</td>


        <td>내용8</td>
    </tr>
    <tr>
        <td>내용9</td>
        <td rowspan="2">rowspan="2" 영역</td>
        <td>내용11</td>
        <td>내용12</td>

    </tr>
    <tr>
        <td>내용13</td>

        <td>내용15</td>
        <td>내용16</td>
    </tr>
    </tbody>










</body>
</html>
